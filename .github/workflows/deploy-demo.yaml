name: Deploy LaunchPad images for the Strapi demos

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  trigger-build-on-gitlab:
    name: Trigger GitLab Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: GitLab Pipeline Trigger
        # Pinned to the v1.2.0 tag's commit SHA, not the mutable tag itself —
        # this action receives two secrets as inputs, and a re-tagged/compromised
        # release of a low-adoption third-party action is a real supply-chain
        # vector (see the tj-actions/changed-files incident).
        uses: digital-blueprint/gitlab-pipeline-trigger-action@7fef6b4967aef68a1671ccf42a6e45f7a27487d8 # v1.2.0
        with:
          trigger_token: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
          access_token: ${{ secrets.GITLAB_API_TOKEN }}
          id: '21258300'
          ref: 'master'
          variables: '{ "BUILD_LAUNCHPAD_IMAGES":"true" }'
